name: Refresh feeds

on:
  schedule:
    # Hourly at :37 — GitHub drops/delays top-of-the-hour crons under load.
    - cron: "37 * * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh all feeds into Neon
        run: pnpm --filter @reed/worker refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}


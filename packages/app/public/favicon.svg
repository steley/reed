<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Reed favicon — a reed stalk whose wind-blown plume bends into the three arcs of an RSS signal. Ink stem, ember plume. Adapts to dark mode. -->
  <defs>
    <linearGradient id="plume" gradientUnits="userSpaceOnUse" x1="178" y1="328" x2="410" y2="96">
      <stop offset="0" stop-color="#d9480f"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="plume-dark" gradientUnits="userSpaceOnUse" x1="178" y1="328" x2="410" y2="96">
      <stop offset="0" stop-color="#e8590f"/>
      <stop offset="1" stop-color="#ffab70"/>
    </linearGradient>
  </defs>
  <rect class="bg" x="0" y="0" width="512" height="512" rx="112" fill="#faf9f7"/>
  <path class="stem" d="M182 434 C176 402 174 372 177 344" fill="none" stroke="#1f1d1a" stroke-width="22" stroke-linecap="round"/>
  <path class="ground" d="M126 452 H386" fill="none" stroke="#b3afa7" stroke-width="15" stroke-linecap="round"/>
  <g class="plume" fill="none" stroke="url(#plume)" stroke-width="34" stroke-linecap="round" transform="rotate(-12 178 328)">
    <circle cx="178" cy="328" r="27" fill="url(#plume)" stroke="none"/>
    <path d="M178 240 A88 88 0 0 1 266 328"/>
    <path d="M178 168 A160 160 0 0 1 338 328"/>
    <path d="M178 96 A232 232 0 0 1 410 328"/>
  </g>
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121212; }
      .stem { stroke: #e9e7e2; }
      .ground { stroke: #6e6a64; }
      .plume { stroke: url(#plume-dark); }
      .plume circle { fill: url(#plume-dark); }
    }
  </style>
</svg>
